<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" font-family="DejaVu Sans, Arial, sans-serif" font-size="11">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>
  <g stroke="#7a8a99" stroke-width="1.2">
    <rect x="10" y="10" width="330" height="44" rx="6" fill="#eef3f8"/>
    <rect x="10" y="78" width="330" height="44" rx="6" fill="#eef3f8"/>
    <rect x="10" y="146" width="330" height="56" rx="6" fill="#e3eef9"/>
    <rect x="10" y="226" width="330" height="56" rx="6" fill="#e6f2e6"/>
    <rect x="10" y="306" width="330" height="56" rx="6" fill="#e6f2e6"/>
    <rect x="360" y="146" width="330" height="56" rx="6" fill="#f6efe3"/>
    <rect x="360" y="296" width="330" height="76" rx="6" fill="#f3f0f8"/>
  </g>
  <g fill="#1a1a1a" text-anchor="middle">
    <text x="175" y="28" font-weight="bold">Boundary</text>
    <text x="175" y="44">a polygon layer, or a map service and a where clause</text>
    <text x="175" y="96" font-weight="bold">HUC12 watersheds</text>
    <text x="175" y="112">those it touches, and those draining into them</text>
    <text x="175" y="165" font-weight="bold">Level A: the whole area at 10 m</text>
    <text x="175" y="181">routing, valley bottoms, confinement, valley form,</text>
    <text x="175" y="195">fans, valley types (on the SSURGO soils)</text>
    <text x="175" y="245" font-weight="bold">Level B: one HUC12 at a time, on 1 m lidar</text>
    <text x="175" y="261">stream types, section plots, stable / unstable form;</text>
    <text x="175" y="275">then the 10 m confinement breaks calibrated</text>
    <text x="175" y="325" font-weight="bold">Valleys on the lidar at 3 m (optional)</text>
    <text x="175" y="341">HUC12 by HUC12, several at once,</text>
    <text x="175" y="355">compared with the 10 m valleys</text>
    <text x="525" y="165" font-weight="bold">Watershed data per HUC12</text>
    <text x="525" y="181">fire history, ecological sites, PRISM climate,</text>
    <text x="525" y="195">Atlas 14 storm depths, RAP cover and trends</text>
    <text x="525" y="315" font-weight="bold">Merged, summarised, ranked</text>
    <text x="525" y="331">merged layers for the boundary, huc12_summary,</text>
    <text x="525" y="347">stream power, major streams, huc12_sensitivity,</text>
    <text x="525" y="363">and RESULTS.md</text>
  </g>
  <g stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="175" y1="54" x2="175" y2="76"/>
    <line x1="175" y1="122" x2="175" y2="144"/>
    <line x1="175" y1="202" x2="175" y2="224"/>
    <line x1="175" y1="282" x2="175" y2="304"/>
    <line x1="340" y1="100" x2="523" y2="144"/>
    <line x1="340" y1="334" x2="358" y2="334"/>
    <line x1="525" y1="202" x2="525" y2="294"/>
  </g>
</svg>
